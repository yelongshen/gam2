# @package _global_
# SONIC release variant without teleop encoder sampling, while keeping G1-SMPL latent consistency.

defaults:
  - /exp/manager/universal_token/all_modes/sonic_release
  - override /aux_losses: universal_token/g1_recon_and_g1_smpl_consistency
  - override /actor_critic: universal_token/g1_smpl_mlp_v1
  - _self_

manager_env:
  commands:
    motion:
      encoder_sample_probs:
        g1: 1.0
        smpl: 1.0
      teleop_sample_prob_when_smpl: 0.0
      motion_lib_cfg:
        motion_file: data/locomotion/robot_filtered
        smpl_motion_file: data/locomotion/smpl_filtered

algo:
  config:
    actor:
      backbone:
        active_encoders: ["g1", "smpl"]
        reencode_smpl_g1_recon: true