# @package _global_
# SONIC release variant without teleop encoder sampling and without cycle-consistency losses.

defaults:
  - sonic_release
  - override /aux_losses: universal_token/g1_recon_and_g1_smpl_latent
  - override /actor_critic: universal_token/g1_smpl_mlp_v1
  - _self_

manager_env:
  commands:
    motion:
      encoder_sample_probs:
        g1: 1.0
        smpl: 1.0
      teleop_sample_prob_when_smpl: 0.0

algo:
  config:
    actor:
      backbone:
        active_encoders: ["g1", "smpl"]
        reencode_smpl_g1_recon: false